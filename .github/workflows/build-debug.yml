name: Build Debug Container (manual)

# Manual only. The debug image ships an unminified frontend + backend bundle
# with source maps and is never built automatically -- run this from the
# Actions tab on whichever branch or tag you want to debug.
on:
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v7

      # ── Container image ───────────────────────────────────────
      # Same in-image build as build.yml, but KIKO_DEBUG=1 switches the build
      # stage to the debug frontend build and the unminified backend bundle
      # with source maps (see Containerfile).
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=false is load-bearing: the default (latest=auto) emits an
          # unsuffixed `latest` whenever type=semver matches, and the per-entry
          # suffix below does NOT apply to it -- so a debug run on a tag would
          # publish the debug image as `latest`.
          flavor: latest=false
          tags: |
            type=ref,event=branch,suffix=-debug
            type=sha,prefix={{branch}}-,suffix=-debug,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}},suffix=-debug
            type=raw,value=latest-debug,enable={{is_default_branch}}

      - name: Lowercase the image name and tags
        id: names
        run: |
          echo "image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<TAGS_EOF'
            echo "${{ steps.meta.outputs.tags }}" | tr '[:upper:]' '[:lower:]'
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build container image
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ steps.names.outputs.image }}
          tags: ${{ steps.names.outputs.tags }}
          context: ./
          containerfiles: |
            ./Containerfile
          # Debug build: unminified WebApp and backend bundle, with source maps.
          build-args: |
            KIKO_DEBUG=1
          oci: true

      - name: Push image to GitHub Container Registry
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.names.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
