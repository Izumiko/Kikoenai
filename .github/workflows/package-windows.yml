name: Package Windows portable zip

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package-windows:
    # The bundle has no native modules any more, so the portable package is
    # assembled on Linux: the only Windows binaries in it (node.exe, ffmpeg,
    # ffprobe) are downloaded prebuilt.
    runs-on: ubuntu-latest
    name: Build Windows portable zip
    env:
      # Tag-triggered builds name the zip after the tag (vX.Y.Z -> X.Y.Z), the
      # source of truth for releases; backend/package.json may lag behind tags.
      # workflow_dispatch (no tag) leaves this empty -> packager falls back to
      # backend/package.json's version.
      PACKAGE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Full install (dev + prod) -- needed to build the frontend (Quasar
      # toolchain) and to bundle the backend (esbuild).
      - name: Install dependencies
        run: npm ci

      # scripts/package.js: builds the frontend and the backend bundle, then
      # stages node/node.exe (pinned Node 26 win-x64), app/ (= backend/build/),
      # ffmpeg/{ffmpeg,ffprobe}.exe and the launcher bat, and zips the folder.
      - name: Package Windows portable zip
        run: npm run package:windows

      - name: Upload staged folder artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kikoenai-windows-x64
          path: package/windows/Kikoenai
          if-no-files-found: error
          retention-days: 30

      # Attach the zip to a GitHub release when building from a tag.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: package/dist/Kikoenai-windows-x64-*.zip
          # Publish straight away; notes are GitHub's generated list of PRs
          # merged since the previous tag, so land features via PR to see them.
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
